name: CAD Gallery
# ~/.config/shell/gh-status.sh

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write      # für GitHub Releases (Assets hochladen)
  pages: write         # für GitHub Pages deploy
  id-token: write      # Pages OIDC-Auth

on:
  push:
    branches: [master]
    tags: ['v*']

jobs:
  export:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Cache conda environment
        uses: actions/cache@v4
        with:
          path: ~/miniconda3/envs/freecad-env
          key: conda-freecad-${{ runner.os }}-${{ hashFiles('.github/workflows/cad-gallery.yaml') }}
          restore-keys: conda-freecad-${{ runner.os }}-

      - name: Install Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: freecad-env
          conda-remove-defaults: true

      - name: Install FreeCAD
        run: |
          if ! conda list freecad | grep -q freecad; then
            conda install -c conda-forge python=3.12 freecad -y
          fi

      - name: Export STL + STEP
        run: freecadcmd scripts/export.py

      - uses: actions/upload-artifact@v4
        with:
          name: cad-exports
          path: exports/

  screenshots:
    runs-on: ubuntu-latest
    needs: export
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Cache conda environment
        uses: actions/cache@v4
        with:
          path: ~/miniconda3/envs/freecad-env
          key: conda-freecad-${{ runner.os }}-${{ hashFiles('.github/workflows/cad-gallery.yaml') }}
          restore-keys: conda-freecad-${{ runner.os }}-

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: freecad-env
          conda-remove-defaults: true

      - name: Install FreeCAD
        run: |
          if ! conda list freecad | grep -q freecad; then
            conda install -c conda-forge python=3.12 freecad -y
          fi

      - run: sudo apt-get install -y xvfb

      - name: Render PNG screenshots
        continue-on-error: true
        run: xvfb-run -a freecadcmd scripts/render_screenshots.py

      - name: Create placeholder if no screenshots
        run: |
          mkdir -p gallery/img
          if [ -z "$(ls -A gallery/img 2>/dev/null)" ]; then
            echo "No screenshots generated, creating placeholder"
            touch gallery/img/.gitkeep
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: gallery/img/

  build-gallery:
    runs-on: ubuntu-latest
    needs: [export, screenshots]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cad-exports
          path: exports/
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: screenshots
          path: gallery/img/

      - name: Build gallery HTML
        run: python scripts/build_gallery.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./gallery

  deploy:
    runs-on: ubuntu-latest
    needs: build-gallery
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    runs-on: ubuntu-latest
    needs: export
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cad-exports
          path: exports/
      - uses: softprops/action-gh-release@v2
        with:
          files: exports/**
