name: CAD Gallery
permissions:
  contents: write      # für GitHub Releases (Assets hochladen)
  pages: write         # für GitHub Pages deploy
  id-token: write      # Pages OIDC-Auth
on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest

      - name: Install FreeCAD
        run: conda install -c conda-forge freecad -y

      - name: Export STL + STEP
        run: FreeCADCmd scripts/export.py

      - uses: actions/upload-artifact@v4
        with:
          name: cad-exports
          path: exports/

  screenshots:
    runs-on: ubuntu-latest
    needs: export
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
      - run: conda install -c conda-forge freecad -y
      - run: sudo apt-get install -y xvfb

      - name: Render PNG screenshots
        run: xvfb-run -a FreeCADCmd scripts/render_screenshots.py

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: gallery/img/

  build-gallery:
    runs-on: ubuntu-latest
    needs: [export, screenshots]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cad-exports
          path: exports/
      - uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: gallery/img/

      - name: Build gallery HTML
        run: python scripts/build_gallery.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gallery

  release:
    runs-on: ubuntu-latest
    needs: export
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cad-exports
          path: exports/
      - uses: softprops/action-gh-release@v2
        with:
          files: exports/**
